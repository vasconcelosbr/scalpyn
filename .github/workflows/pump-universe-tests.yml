name: Pump Universe Contract
on:
  pull_request:
    paths: ['pump_ml/**', 'backend/app/services/pump*.py', 'backend/tests/test_pump*.py', 'backend/scripts/export_pump_research.py', 'backend/scripts/validate_pump_capture_temp.py', '.github/workflows/pump-universe-tests.yml']
  push:
    branches: [main]
    paths: ['pump_ml/**', 'backend/app/services/pump*.py', 'backend/tests/test_pump*.py', 'backend/scripts/export_pump_research.py', 'backend/scripts/validate_pump_capture_temp.py', '.github/workflows/pump-universe-tests.yml']
jobs:
  pump-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pump_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUMP_TIMING_TEST_DATABASE_URL: postgresql+asyncpg://postgres:pump_test@127.0.0.1:5432/postgres
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: pip install pytest pandas==2.2.2 'sqlalchemy[asyncio]>=2.0.31' asyncpg alembic 'fakeredis[lua]' fastapi pydantic-settings -r pump_ml/requirements.txt
      - name: Verify durable Pump observation timing
        working-directory: backend
        run: python -m pytest tests/test_pump_monitor_timing.py -q
      - name: Verify Pump filter and price-support contracts
        working-directory: backend
        run: python -m pytest tests/test_pump_market_cap_universe.py tests/test_pump_monitor.py tests/test_pump_research.py tests/test_pump_monitor_exhaustion_veto.py tests/test_pool_selection.py tests/test_pump_opportunity.py tests/test_pump_exact_price_paths.py tests/test_pump_fifo_reader_sql.py tests/test_pump_capture_batch.py tests/test_pump_pre_touch_drawdown.py tests/test_pump_intelligence.py tests/test_pump_executive_insights.py tests/test_pump_contracts.py tests/test_pump_ml_daily_job.py tests/test_pump_ml_selection.py tests/test_pump_ml_temporal_selection.py tests/test_pump_directional_research.py tests/test_pump_ml_v1_influence.py tests/test_pump_ml_context_calibration.py tests/test_pump_ml_relative_direction.py tests/test_pump_ml_sampling_momentum.py tests/test_pump_ml_walk_forward.py tests/test_pump_ml_candles.py tests/test_pump_ml_live.py tests/test_pump_flow_history.py tests/test_pump_config_overrides.py tests/test_pump_ml_feature_groups.py tests/test_pump_taker_flow.py -q
