name: Pump Universe Contract
on:
  pull_request:
    paths: ['pump_ml/**', 'backend/app/services/pump*.py', 'backend/tests/test_pump*.py', 'backend/scripts/export_pump_research.py', '.github/workflows/pump-universe-tests.yml']
  push:
    branches: [main]
    paths: ['pump_ml/**', 'backend/app/services/pump*.py', 'backend/tests/test_pump*.py', 'backend/scripts/export_pump_research.py', '.github/workflows/pump-universe-tests.yml']
jobs:
  pump-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: pip install pytest pandas==2.2.2 numpy==1.26.4 'sqlalchemy[asyncio]>=2.0.31' asyncpg fastapi pydantic-settings
      - name: Verify Pump filter and price-support contracts
        working-directory: backend
        run: python -m pytest tests/test_pump_market_cap_universe.py tests/test_pump_monitor.py tests/test_pump_research.py tests/test_pump_monitor_exhaustion_veto.py tests/test_pool_selection.py tests/test_pump_opportunity.py tests/test_pump_exact_price_paths.py tests/test_pump_contracts.py tests/test_pump_ml_daily_job.py -q
