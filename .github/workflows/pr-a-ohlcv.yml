name: OHLCV queue and comparison validation
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/pr-a-ohlcv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: scalpyn_pr_a_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codex -d scalpyn_pr_a_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PR_A_TEST_DATABASE_URL: postgresql+asyncpg://codex:local-test-only@127.0.0.1:5432/scalpyn_pr_a_test
      TEST_DATABASE_URL: postgresql+asyncpg://codex:local-test-only@127.0.0.1:5432/scalpyn_pr_a_test
      PR_A_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql+asyncpg://codex:local-test-only@127.0.0.1:5432/scalpyn_pr_a_test
      REDIS_URL: redis://127.0.0.1:6379/15
      MTF_TEST_DATABASE_URL: postgresql+psycopg://codex:local-test-only@127.0.0.1:5432/mtf_chart_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: PGPASSWORD=local-test-only psql -h 127.0.0.1 -U codex -d scalpyn_pr_a_test -c 'CREATE DATABASE mtf_chart_test'
      - working-directory: backend
        run: |
          python -m alembic heads
          python -m pytest -q tests/test_profile_display_query_postgres.py tests/test_l3_armed_observation.py tests/test_l3_profile_consolidation.py tests/test_l3_consolidated_watchlist.py tests/test_mtf_history.py tests/test_mtf_chart_postgres.py tests/test_mtf_chart_engine.py tests/test_mtf_chart_api.py tests/test_mtf_btc_market.py tests/test_mtf_btc_timeframe.py tests/test_mtf_fear_greed.py tests/test_mtf_veto_filters.py tests/test_mtf_settings.py tests/test_mtf_entry_band.py tests/test_mtf_structure.py tests/test_mtf_structure_indicators.py tests/test_mtf_trigger_diagnostics.py tests/test_mtf_ui_v2.py tests/test_mtf_pump_flow.py tests/test_shadow_entry_signal_filter.py tests/test_shadow_fixed_exit_policy.py tests/test_shadow_barrier_v2_fail_closed.py tests/test_shadow_trailing_contract.py tests/test_shadow_barrier_contract_v3.py tests/test_strategy_settings_recovery.py tests/test_strategy_settings_aggregate.py tests/test_mtf_recovery_gate.py
          python -m pytest -q tests/test_m5_freshness_isolation.py tests/test_parallel_5m_compute.py tests/test_profile_refresh_flow_pending.py
          python -m pytest -q tests/test_profile_display_status.py tests/test_shadow_structural_atr_postgres.py tests/test_m5_closed_source_clock.py tests/test_recovery_m5_shadow.py tests/test_l3_stable_allow_shadow.py tests/test_l3_public_authorization.py tests/test_l3_authorization_outbox_v3.py
          python -m pytest -q tests/test_ohlcv_recovery_postgres.py tests/test_ohlcv_queue_isolation.py tests/test_ohlcv_comparison_postgres.py tests/test_ohlcv_broker_isolation.py tests/test_research_ohlcv_pipeline.py tests/test_celery_routing_invariants.py tests/test_celery_queue_status_and_dedup.py tests/test_celery_diagnostics_endpoint.py
