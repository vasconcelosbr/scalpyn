name: OHLCV queue and comparison validation
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/pr-a-ohlcv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: scalpyn_pr_a_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codex -d scalpyn_pr_a_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PR_A_TEST_DATABASE_URL: postgresql+asyncpg://codex:local-test-only@127.0.0.1:5432/scalpyn_pr_a_test
      PR_A_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql+asyncpg://codex:local-test-only@127.0.0.1:5432/scalpyn_pr_a_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: |
          python -m alembic heads
          python -m pytest -q tests/test_ohlcv_queue_isolation.py tests/test_ohlcv_comparison_postgres.py tests/test_ohlcv_broker_isolation.py tests/test_research_ohlcv_pipeline.py tests/test_celery_routing_invariants.py tests/test_celery_queue_status_and_dedup.py tests/test_celery_diagnostics_endpoint.py
